# yaml-language-server: $schema=https://app.stainless.com/config.schema.json

organization:
  name: free-use-bible-api
  docs: https://bible.helloao.org/docs/reference/
  contact: ''

targets:
  typescript:
    package_name: free-use-bible-api
    production_repo: null
    publish:
      npm: false
    options:
      mcp_server: true

environments:
  production: https://bible.helloao.org

resources:
  api:
    models:
      translation: '#/components/schemas/Translation'
      translation_book: '#/components/schemas/TranslationBook'
      chapter_data: '#/components/schemas/ChapterData'
      available_translations: '#/components/schemas/AvailableTranslations'
      translation_books: '#/components/schemas/TranslationBooks'
      translation_book_chapter: '#/components/schemas/TranslationBookChapter'
    methods:
      list_available_translations: get /api/available_translations
      list_books: get /api/{translation}/books
      retrieve_chapter: get /api/{translation}/{book}/{chapter}

settings:
  disable_mock_tests: true
  license: MIT

# No client_settings.opts needed for no-auth

security: 
  - {}

readme:
  example_requests:
    default:
      type: request
      endpoint: get /api/available_translations
      params: {}
    headline:
      type: request
      endpoint: get /api/available_translations
      params: {}
    books:
      type: request
      endpoint: get /api/{translation}/books
      params:
        translation: BSB
    chapter:
      type: request
      endpoint: get /api/{translation}/{book}/{chapter}
      params:
        translation: BSB
        book: GEN
        chapter: 1